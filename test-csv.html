<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de CSV</title>
</head>
<body>
    <h1>Prueba de parsing de CSV</h1>
    <div id="output"></div>

    <script>
        // Función auxiliar para parsear una línea de CSV con comillas
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current);
            return result;
        }

        // Función para parsear CSV con soporte para comillas
        function parseCSV(csvText) {
            // Eliminar BOM si está presente
            if (csvText.charCodeAt(0) === 0xFEFF) {
                csvText = csvText.slice(1);
            }

            const lines = csvText.split('\n');
            const headers = parseCSVLine(lines[0]);

            return lines.slice(1).map(line => {
                const values = parseCSVLine(line);
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header.trim()] = values[index] ? values[index].trim() : '';
                });
                return obj;
            }).filter(obj => obj.name && obj.name !== ''); // Filtrar líneas vacías
        }

        // Cargar y procesar el CSV
        fetch('catalogo/gamer.csv')
            .then(response => response.text())
            .then(csvText => {
                const products = parseCSV(csvText);
                const output = document.getElementById('output');

                output.innerHTML = `
                    <p><strong>Total de productos:</strong> ${products.length}</p>
                    <h2>Primeros 5 productos:</h2>
                    <ul>
                        ${products.slice(0, 5).map(product => `
                            <li>
                                <strong>${product.name}</strong><br>
                                Precio: ${product.price}<br>
                                Marca: ${product.brand}<br>
                                Imagen: ${product.image}
                            </li>
                        `).join('')}
                    </ul>
                `;

                console.log('Productos cargados:', products);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('output').innerHTML = `<p>Error: ${error.message}</p>`;
            });
    </script>
</body>
</html>
